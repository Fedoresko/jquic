name: Build and Verify

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      push_docker:
        description: 'Push Docker image to registry'
        required: true
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-quic-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 👈 This fetches all history and all git tags

    - name: Trust Workspace Directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: gradle build :quic-application:shadowJar

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jquic-artifacts
        path: |
          jquic/build/libs/*.jar
          http3/build/libs/*.jar
          quic-application/build/libs/*.jar

    - name: Set up Docker Buildx
      if: github.event_name == 'workflow_dispatch' && inputs.push_docker
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Container registry
      if: github.event_name == 'workflow_dispatch' && inputs.push_docker
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      if: github.event_name == 'workflow_dispatch' && inputs.push_docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      if: github.event_name == 'workflow_dispatch' && inputs.push_docker
      with:
        context: ./quic-application
        file: ./quic-application/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          JAR_FILE=build/libs/quic-application-1.0-SNAPSHOT-all.jar
